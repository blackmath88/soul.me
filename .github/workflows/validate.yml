name: validate

on: push

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/validate.py vault --summary
      # intake plumbing against a deterministic stub model (no real model, no real data)
      - run: |
          python tests/stub_llm.py 8765 &
          sleep 1
          python tools/eval_extract.py --base http://127.0.0.1:8765/v1 --model stub
      - run: python tests/test_chatgpt_import.py
      - run: python tests/test_export.py
      - run: python tests/test_curate.py
      - run: python tests/test_mcp_server.py
      - run: python tests/test_conflicts.py
      - run: python tests/test_interview.py
      - run: python tests/test_staged_intake.py
